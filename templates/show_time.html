<link rel="stylesheet" href="css/showTime.css">

<div class="show-time-screen">
    <div class="menu-column left-column">
        <div class="character-select" data-character="blonde"><img src="assets/images/avatar/avatar_1.png" alt="Blonde Hair Character"></div>
        <div class="character-select" data-character="short"><img src="assets/images/avatar/avatar_2.png" alt="Short Hair Character"></div>
        <div class="character-select" data-character="curly"><img src="assets/images/avatar/avatar_3.png" alt="Curly Character"></div>
    </div>

    <div class="menu-column center-column">
        <div class="main-closet-frame">
            <div class="character-display-area" id="show-time-character">
                <img src="#" alt="Main Character" class="character-base">
                <img src="#" alt="worn shoe" class="worn-item" id="worn-shoe">
                <img src="#" alt="worn trouser" class="worn-item" id="worn-trouser">
                <img src="#" alt="worn trouser" class="worn-item" id="worn-trouser"> 
                <img src="#" alt="worn earring" class="worn-item" id="worn-earring">
                <div id="hair-zone" class="interaction-zone">
                    <img src="#" alt="worn hairclip" class="worn-item" id="worn-hairclip">
                </div>
                <img src="#" alt="worn necklace" class="worn-item" id="worn-necklace">
                <img src="#" alt="worn dress" class="worn-item" id="worn-dress">
                <img src="#" alt="worn shirt" class="worn-item" id="worn-shirt">
                <img src="#" alt="worn skirt" class="worn-item" id="worn-skirt">
            </div>
        </div>

        <div class="vicky-chat-box">
            <img src="assets/images/Vicky/NPC_Vicky_3.png" alt="Vicky NPC" class="vicky-npc-image">
            <div class="chat-bubble">
                <p>Wow, you look absolutely stunning! Ready for the spotlight?</p>
            </div>
        </div>
    </div>

    <div class="menu-column right-column">
        <div class="side-menu-item" data-target="introduction"><img src="assets/images/Card/introduction.png" alt="Introduction"></div>
        <div class="side-menu-item" data-target="dressing_game"><img src="assets/images/Card/DressingGame.png" alt="Dressing Game"></div>
        <div class="side-menu-item" data-target="photo_booth"><img src="assets/images/Card/PhotoBooth.png" alt="Photo Booth"></div>
    </div>

    <div class="bottom-toolbar">
        <button class="action-button home-button"><img src="assets/images/button/Btn Home.png" alt="Home"></button>
        <button class="action-button music-button"><img src="assets/images/button/Btn music.png" alt="Music"></button>
    </div>
</div>
